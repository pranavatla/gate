# Every push to main ships to https://gate.atla.in:
# build the arm64 image → push to ECR → record the release in compose.yaml →
# publish the deploy bundle to S3 → restart the gateway on the host through SSM → health check.
# AWS access is a short-lived OIDC session for the gate-github-deploy role (infra/terraform/github.tf).
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "infra/terraform/**"
      - "examples/**"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write   # commit the release tag back to main
  id-token: write   # OIDC sign-in to AWS

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::361739112666:role/gate-github-deploy
  REGISTRY: 361739112666.dkr.ecr.ap-south-1.amazonaws.com
  BUCKET: gate-backups-361739112666
  INSTANCE_ID: i-08d9c63cf23ca7ebc

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm   # native arm64, same as the Graviton host
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Test evaluation comparison logic
        run: |
          python3 -m venv /tmp/gate-unit-tests
          /tmp/gate-unit-tests/bin/pip install asyncpg==0.31.0 python-dotenv==1.2.3
          /tmp/gate-unit-tests/bin/python -m unittest discover -s tests -v

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # Tags are immutable in ECR, so a re-run of the same commit reuses the image.
          if aws ecr describe-images --repository-name gate --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "Image gate:$TAG already in ECR, skipping build"
          else
            docker build --provenance=false --pull -t "$REGISTRY/gate:$TAG" .
            docker push "$REGISTRY/gate:$TAG"
          fi

      - name: Record release in compose.yaml
        run: |
          sed -i -E "s|(image: ${REGISTRY}/gate:)[A-Za-z0-9._-]+|\1$TAG|" deploy/app/compose.yaml
          grep -q "image: $REGISTRY/gate:$TAG" deploy/app/compose.yaml
          if git diff --quiet; then
            echo "compose.yaml already on gate:$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release gateway image $TAG to production"
            git pull --rebase origin main
            # Pushed with GITHUB_TOKEN, which does not start another workflow run.
            git push origin HEAD:main
          fi

      - name: Publish deploy bundle to S3
        run: ./deploy/publish.sh

      - name: Restart gateway on host
        run: |
          PARAMS=$(jq -n --arg b "$BUCKET" --arg r "$REGISTRY" --arg region "$AWS_REGION" '{commands: [
            "set -eu",
            "export HOME=/root",
            "aws s3 sync s3://\($b)/deploy/ /opt/gate/ --exact-timestamps --region \($region)",
            "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($r)",
            "cd /opt/gate/app && bash ./render-env.sh && docker compose pull gateway && docker compose up -d gateway && docker compose exec -T gateway python -m app.evalcheck pending",
            "install -m 0644 /opt/gate/app/systemd/gate-eval.service /opt/gate/app/systemd/gate-eval.timer /etc/systemd/system/",
            "systemctl daemon-reload && systemctl enable gate-eval.timer && systemctl restart gate-eval.timer",
            "systemctl is-active --quiet gate-eval.timer",
            "systemctl list-timers gate-eval.timer --no-pager"
          ]}')
          CMD=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "gate deploy $TAG" \
            --parameters "$PARAMS" --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query '{status: Status, output: StandardOutputContent, errors: StandardErrorContent}' --output json
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" --query Status --output text)
          test "$STATUS" = "Success"

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://gate.atla.in/health | grep -q '"ok"'; then
              echo "gate.atla.in is healthy on gate:$TAG"; exit 0
            fi
            sleep 5
          done
          echo "gate.atla.in did not report healthy within 60 s"; exit 1
