name: gate

services:
  gate-postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: gate
      POSTGRES_DB: gate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GATE_READONLY_PW: ${GATE_READONLY_PW}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate -d gate"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  gate-redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 96m

  gateway:
    image: 361739112666.dkr.ecr.ap-south-1.amazonaws.com/gate:e005054
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BEDROCK_API_KEY: ${BEDROCK_API_KEY}
      BEDROCK_REGION: ap-south-1
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT}
      DATABASE_URL: postgresql://gate:${POSTGRES_PASSWORD}@gate-postgres:5432/gate
      REDIS_URL: redis://gate-redis:6379/0
      CHAOS_ENABLED: "false"
      RATELIMIT_FAIL_OPEN: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      gate-postgres:
        condition: service_healthy
      gate-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384m

  gate-grafana:
    image: grafana/grafana-oss:13.0.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GATE_READONLY_PW: ${GATE_READONLY_PW}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      gate-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  pgdata:
  grafana:
  caddy_data:
  caddy_config:
